name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      MPLCONFIGDIR: /tmp/kc761-mpl-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          grep -v -i '^geant4' requirements.txt > /tmp/kc761-requirements.txt
          python -m pip install -r /tmp/kc761-requirements.txt ruff pytest hypothesis
      - name: Single-source gate
        run: python tools/check_single_source.py
      - name: Lint
        run: ruff check .
      - name: Tests without Geant4 or the ROOT executable
        run: pytest -q -m "not g4 and not root"
      - name: Entry points
        run: |
          python kc761.py --help > /dev/null
          python -m kc761 --help > /dev/null
      - name: Example configurations (dry run)
        run: |
          for config in calib compose sim unfold; do
            python kc761.py "$config" -c "examples/${config}.toml" --dry-run > /dev/null
          done
