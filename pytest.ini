[pytest]
pythonpath = .
testpaths = tests
addopts = -ra
markers =
    g4: requires Geant4 (not available in the contract CI)
    root: requires the ROOT executable (not available in the contract CI)
    strict: strict-mode certificate runs
    slow: heavy statistical coverage loops (`-m "not slow"` skips them)
    bench: wall-clock benchmarks; never a correctness gate (excluded from CI)
