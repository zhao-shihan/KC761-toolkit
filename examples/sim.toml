# kc761 sim batch config (D-134..D-138): serial runs, one fresh process each.
config_version = 1

[sim]
resume = true      # skip a run whose output exists and validates
force = false      # overwrite existing outputs
dry_run = false    # print the resolved commands only

# Source mode: exactly one of `source` (key) or `mode` + `calib`; `events` required.
[[sim.runs]]
source = "am241"
events = 3_000_000
# seed = 908136382    # default 908136382
# threads = 8         # default: automatic memory budget
# verbose = 0
# output = "work/sim/am241-n3000000-s908136382.root"   # default output naming

[[sim.runs]]
source = "lu176"
events = 20_000_000

[[sim.runs]]
source = "ra226"
events = 100_000_000

[[sim.runs]]
source = "th232"
events = 200_000_000

[[sim.runs]]
source = "k40"
events = 1_000_000_000

# Matrix mode: `mode` is "plane-front-gamma" or "sphere-gamma"; `calib` supplies both axes.
[[sim.runs]]
mode = "plane-front-gamma"
calib = "work/calib/calib-2609a.root"
events = 100_000_000
threads = 8
