# kc761 compose example (D-139): compose R = C . p_tilde . diag(eta) once.
#
# `calib` is a calibration product and `sim` is a matrix-mode simulation
# product. When `output` is omitted the default is
# out/compose/compose-<calib-stem>-<sim-stem>.root.
config_version = 1

[compose]
calib = "out/calib/calib-am241.root"
sim = "out/sim/calib-am241-plane-front-gamma-n10000000-s908136382.root"
# output = "out/compose/custom.root"
