# kc761tool unfold config (D-139/D-154/D-169/D-187/D-188/D-191/D-193).
# Full mode: needs data, calib, sim and the energy window; alpha defaults to 1.
# calib_only = true: relabel the channel axis to energy; omit sim/energy_low/energy_high.
# The three inputs below are the shipped Th-232 run, so this example reproduces
# its recorded product (window 30-3000 keV, realized snip_iterations = 21).
config_version = 1

[unfold]
data = "work/data/th232-sub-bkg.root"
calib = "work/calib/calib.root"
sim = "work/sim/calib-plane-front-gamma-n1000000000-s908136382.root"
energy_low = 30.0
energy_high = 3000.0
syst_frac = 0.05
# alpha = 1.0                # Tikhonov strength (default, D-191)
# calib_only = false
# difference_order = 2
# snip_enabled = true
# snip_threshold = 5.0
# snip_protect_bins = 3      # protective half-width in primary bins (D-188)
# snip_floor = 0.01          # penalty weight floor (default, D-191)
# snip_iterations = <m>      # explicit override; default: resolution-derived (D-157)
# snip_max_iterations = 32   # cap for the resolution-derived count (default, D-191)
# output = "..."             # default: work/unfold/unfold-<data>-<sim>.root (D-192)
# no_plot = false
# log_plot = false           # add the logarithmic-y spectrum panel (D-193)
# force = false
# dry_run = false
