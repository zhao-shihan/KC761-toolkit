# kc761tool calib config (D-139/D-169): one shared fit over the listed datasets.
config_version = 1

[calib]
output = "work/calib/calib-2609a.root"
no_plot = false
# force = false
# dry_run = false

# Per dataset: required data/mc/label; optional channel_low/high (default: full axis)
# and syst_frac (default 0.05 = 5%).
[[calib.datasets]]
data = "work/data/2609a/am241-260910-subbkg.root"
mc = "work/sim/am241-n3000000-s908136382.root"
label = "Am241"
channel_low = 140
channel_high = 165
syst_frac = 0.05

